name: Validate config of renovate

on:
  pull_request:
    paths:
      - "renovate.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: "24.x"
      - name: Validate config
        run: npx --package renovate -c 'renovate-config-validator'
