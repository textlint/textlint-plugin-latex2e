name: Publish package

on:
    pull_request:
        branches:
            - master
        types: [closed]

jobs:
    publish:
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        permissions:
            contents: write
        steps:
            - name: Checkout source
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - name: Use Node.js "24.x"
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  cache: npm
                  node-version: "24.x"
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Build package
              run: npm run build
            - name: Check availability
              id: check_availability
              run: npx can-npm-publish
              continue-on-error: true
            - name: Check tag
              id: check_tag
              run: |
                TAG=v$(jq -r ".version" package.json)
                if git show-ref --tags | grep -q "refs/tags/${TAG}"
                then
                  echo "${TAG} exists."
                  exit 1
                else
                  echo "${TAG} does not exist. It will add to this repository."
                fi
              continue-on-error: true
            - name: Publish
              id: npm_publish
              if: steps.check_availability.outcome == 'success' && steps.check_tag.outcome == 'success'
              uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4
              with:
                  token: ${{ secrets.NPM_TOKEN }}
            - name: Tagging
              if: steps.npm_publish.conclusion == 'success'
              run: |
                TAG=v$(jq -r ".version" package.json)
                git tag ${TAG}
                git push origin --tags
